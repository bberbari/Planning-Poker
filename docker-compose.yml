version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: planning-poker-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FRONTEND_URL=*
    restart: unless-stopped
    networks:
      - poker-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://172.18.0.2:3001
        - VITE_SOCKET_URL=
    container_name: planning-poker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - poker-network

networks:
  poker-network:
    driver: bridge