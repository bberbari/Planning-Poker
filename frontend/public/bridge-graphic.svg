<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bridge/Archway structure -->
  <g opacity="0.3">
    <!-- Main arch spans -->
    <path d="M 100 200 Q 200 100 300 200" stroke="#1a4d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 200 200 Q 300 100 400 200" stroke="#1a4d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 300 200 Q 400 100 500 200" stroke="#1a4d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Vertical supports -->
    <line x1="150" y1="200" x2="150" y2="350" stroke="#1a4d8c" stroke-width="6" stroke-linecap="round"/>
    <line x1="250" y1="200" x2="250" y2="350" stroke="#1a4d8c" stroke-width="6" stroke-linecap="round"/>
    <line x1="350" y1="200" x2="350" y2="350" stroke="#1a4d8c" stroke-width="6" stroke-linecap="round"/>
    <line x1="450" y1="200" x2="450" y2="350" stroke="#1a4d8c" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Horizontal base -->
    <line x1="100" y1="350" x2="500" y2="350" stroke="#1a4d8c" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Additional decorative arches -->
    <path d="M 100 200 Q 150 150 200 200" stroke="#1a4d8c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 300 200 Q 350 150 400 200" stroke="#1a4d8c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 400 200 Q 450 150 500 200" stroke="#1a4d8c" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
