<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized bridge/archway icon in blue -->
  <g fill="#1a4d8c" stroke="#1a4d8c" stroke-width="0">
    <!-- Two outermost vertical bars (shorter) -->
    <rect x="10" y="45" width="10" height="25" />
    <rect x="100" y="45" width="10" height="25" />
    
    <!-- Two innermost vertical bars (taller) -->
    <rect x="40" y="20" width="10" height="50" />
    <rect x="70" y="20" width="10" height="50" />
    
    <!-- Wide shallow arch connecting outermost bars -->
    <path d="M 15 45 Q 60 35 105 45" stroke="#1a4d8c" stroke-width="7" fill="none" stroke-linecap="round"/>
    
    <!-- Narrower higher arch connecting innermost bars -->
    <path d="M 45 20 Q 60 10 75 20" stroke="#1a4d8c" stroke-width="7" fill="none" stroke-linecap="round"/>
    
    <!-- Horizontal bar at the top connecting innermost bars -->
    <rect x="40" y="20" width="40" height="8" />
  </g>
</svg>
